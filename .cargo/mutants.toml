# Mutation testing configuration.
# Exclusions are documented inline below with reason and expiry condition.
# and expiry condition. Safety-critical recovery functions are tested by
# fault-injection integration tests (see docs/mutation-exclusions.md).
exclude_re = [
    "move_to_dead",
    "receipt_is_authentic",
    "fsck_verify_name_tag",
    "verify_shard_placement",
    "delete_expired_receipts",
    "reap_expired_leases",
    "promote_delayed",
    "cleanup_temp_files",
    "compact_receipts",
    # Optimization guards backed by decode validation: behavioral outcome
    # is identical whether the guard uses == or !=, && or ||.
    "fsck_file",
    "check_duplicate_ack_bounded",
    # Trivial field accessor on Location enum; tested by directory projection tests.
    "Target::shard",
    # Thin TLS fault-check branches and idle paths.
    "fault::check",
    "fault::reset",
    "fault::inject",
    "fault::inject_errno",
    "fault::call_count",
    # writev_all partial-write loop only triggers on non-regular files.
    "writev_all",
    # sync() flushes dirty directories; no unit test can verify
    # durability without crash simulation.
    "Queue::sync",
    # Extension accessor returns the verified bytes; tested with empty
    # extension in the identity test and through receipt verification.
    "VerifiedJob::extension",
    # Defense-in-depth: st_size < 0 is impossible on a real filesystem.
    # file_size() unit tests cover the guard pattern.
    "open_and_validate_current_lease",
    # Payload reader read_at clamps to_read via min(payload_len - offset).
    # The filesystem bounds the actual pread return value independently.
    "VerifiedPayloadReader::read_at",
    # Dead export: opens the object and copies it through std::io::copy.
    "export_dead",
    # Streaming named fallbacks only run when O_TMPFILE is unsupported.
    "named_fallback_streaming",
    "named_fallback_streaming_init",
    "stream_payload_to_fd",
    "enqueue_streaming",
    "stream_and_publish",
    # Init post-commit cleanup: unlink .initializing ENOENT guard
    # is defense-in-depth; the marker is always present at this point.
    "Queue::init",
    # inotify hint plumbing, equivalent mutants only: flag-ORs are
    # equivalent on disjoint constants (IN_NONBLOCK|IN_CLOEXEC,
    # IN_CREATE|IN_MOVED_TO|IN_Q_OVERFLOW); fd/wd guards differ from their
    # mutants only at 0, which the kernel never returns here. The |->& init
    # mutant is caught by timeout (blocking fd hangs drain).
    "inotify\\.rs.*in (init|add_appear_watch)$",
    # Read-only open flags: |->^ is equivalent on the disjoint constants
    # O_RDONLY (0), O_NOFOLLOW, and O_CLOEXEC.
    "raw_read_open_flags",
]
