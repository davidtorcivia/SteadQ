name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, pinned 2026-08-08
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: >-
            aarch64-unknown-linux-gnu aarch64-unknown-linux-musl
            x86_64-unknown-linux-musl x86_64-unknown-linux-gnux32
            riscv64gc-unknown-linux-gnu
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Baseline and generated-artifact checks
        run: cargo xtask check
      - name: Clippy (all targets, deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Reject unsupported targets
        run: |
          # gnux32 and riscv64gc reach the compile gate; 32-bit arm/i686
          # targets fail earlier in fs-linux libc type mismatches, so the
          # pointer-width and arch dimensions are covered by these two.
          for target in x86_64-unknown-linux-gnux32 riscv64gc-unknown-linux-gnu; do
            if CARGO_TERM_COLOR=never cargo check -p steadq-core --target "$target" 2>"/tmp/steadq-target-error-$target"; then
              echo "steadq-core accepted unsupported target $target"
              exit 1
            fi
            grep -F "steadq-core supports only 64-bit x86_64 or aarch64 Linux targets with the gnu or musl environment" "/tmp/steadq-target-error-$target"
          done
      - name: Cross-check supported targets
        run: |
          cargo check -p steadq-core --target aarch64-unknown-linux-gnu
      - name: Static musl binaries
        run: |
          cargo build --release -p steadq-cli --target x86_64-unknown-linux-musl
          RUSTFLAGS="-C linker=rust-lld" cargo build --release -p steadq-cli --target aarch64-unknown-linux-musl
      - name: Build (debug)
        run: cargo build --all
      - name: Build (release)
        run: cargo build --all --release
      - name: C ABI build check
        run: cargo build -p steadq-capi
      - name: Test
        run: cargo test --all
      - name: Generated file drift check
        run: cargo xtask check-generated
      - name: Generated C header drift check
        run: |
          cargo install cbindgen --version 0.27.0 --locked
          cbindgen --crate steadq-capi --output /tmp/steadq_generated.h --config crates/steadq-capi/cbindgen.toml
          diff /tmp/steadq_generated.h crates/steadq-capi/include/steadq.h

  # Fuzz smoke test - gating on PRs
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly, pinned 2026-08-08
        with:
          toolchain: nightly-2026-08-07
          components: rust-src
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-08-07 install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz smoke (format header)
        run: timeout 90 cargo +nightly-2026-08-07 fuzz run fuzz_format_header -- -max_len=160 -runs=5000
      - name: Fuzz smoke (filename parser)
        run: timeout 90 cargo +nightly-2026-08-07 fuzz run fuzz_filename_parser -- -max_len=256 -runs=5000
      - name: Fuzz smoke (CBOR decoder)
        run: timeout 90 cargo +nightly-2026-08-07 fuzz run fuzz_cbor_decoder -- -max_len=1024 -runs=5000
      - name: Fuzz smoke (bucket arithmetic)
        run: timeout 90 cargo +nightly-2026-08-07 fuzz run fuzz_bucket_arithmetic -- -max_len=64 -runs=5000
      - name: Fuzz smoke (transition ticket)
        run: timeout 90 cargo +nightly-2026-08-07 fuzz run fuzz_transition_ticket -- -max_len=1024 -runs=5000
      - name: Fuzz smoke (operation sequence)
        run: timeout 120 cargo +nightly-2026-08-07 fuzz run fuzz_operation_sequence -- -max_len=64 -runs=1000
      - name: Fuzz smoke (queue corruption)
        run: timeout 120 cargo +nightly-2026-08-07 fuzz run fuzz_queue_corruption -- -max_len=64 -runs=1000
      - name: Fuzz smoke (resolve)
        run: timeout 120 cargo +nightly-2026-08-07 fuzz run fuzz_resolve -- -max_len=1024 -runs=2000

  # Mutation testing - diff-based, gating, parallelized by crate
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        crate:
          - steadq-format
          - steadq-names
          - steadq-math
          - steadq-fs-linux
          - steadq-core
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, pinned 2026-08-08
        with:
          toolchain: 1.97.1
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Run mutants for ${{ matrix.crate }} (diff-scoped)
        run: |
          # Always scope mutation testing to the changed lines. Full-crate
          # runs on push to main were unkillable for thin syscall wrappers
          # and pure arithmetic without per-line tests on every operator.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff origin/$GITHUB_BASE_REF...HEAD > /tmp/scope.diff
          else
            # Push to main: previous commit is the merge parent.
            git diff HEAD~1 HEAD > /tmp/scope.diff || git diff HEAD > /tmp/scope.diff
          fi
          if [ ! -s /tmp/scope.diff ]; then
            echo "Empty diff, skipping"
            exit 0
          fi
          if ! grep -q "${{ matrix.crate }}" /tmp/scope.diff; then
            echo "No changes in ${{ matrix.crate }}, skipping"
            exit 0
          fi
          mutation_timeout=60
          if [ "${{ matrix.crate }}" = "steadq-core" ]; then
            mutation_timeout=120
          fi
          cargo mutants -p ${{ matrix.crate }} -j 2 --timeout "$mutation_timeout" --in-diff /tmp/scope.diff --cap-lints true

  # Deep fuzz - extended runs (continue-on-error)
  deep-fuzz:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly, pinned 2026-08-08
        with:
          toolchain: nightly-2026-08-07
          components: rust-src
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-08-07 install cargo-fuzz --version 0.13.2 --locked
      - name: Deep fuzz (50000 runs per target)
        run: |
          timeout 300 cargo +nightly-2026-08-07 fuzz run fuzz_format_header -- -max_len=160 -runs=50000
          timeout 300 cargo +nightly-2026-08-07 fuzz run fuzz_filename_parser -- -max_len=256 -runs=50000
          timeout 300 cargo +nightly-2026-08-07 fuzz run fuzz_cbor_decoder -- -max_len=1024 -runs=50000
          timeout 300 cargo +nightly-2026-08-07 fuzz run fuzz_transition_ticket -- -max_len=1024 -runs=50000
          timeout 600 cargo +nightly-2026-08-07 fuzz run fuzz_operation_sequence -- -max_len=128 -runs=5000
          timeout 600 cargo +nightly-2026-08-07 fuzz run fuzz_queue_corruption -- -max_len=128 -runs=5000
          timeout 300 cargo +nightly-2026-08-07 fuzz run fuzz_resolve -- -max_len=1024 -runs=5000

  # TLA+ model checking with TLC
  tla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Download tla2tools
        run: |
          curl -fsSL https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o /tmp/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  /tmp/tla2tools.jar" | sha256sum --check --strict
      - name: TLC core model checking
        run: java -cp /tmp/tla2tools.jar tlc2.TLC -config model/SteadQ.cfg model/SteadQ.tla -workers auto
      - name: TLC ordered namespace model checking
        run: java -cp /tmp/tla2tools.jar tlc2.TLC -config model/namespace/SteadQNamespaceOrdered.cfg model/SteadQNamespace.tla -workers auto
      - name: TLC weak namespace model checking
        run: java -cp /tmp/tla2tools.jar tlc2.TLC -config model/namespace/SteadQNamespaceWeak.cfg model/SteadQNamespace.tla -workers auto
      - name: TLC scheduling model checking
        run: java -cp /tmp/tla2tools.jar tlc2.TLC -config model/scheduling/SteadQScheduling.cfg model/SteadQScheduling.tla -workers auto
      - name: TLC receipt evidence model checking
        run: java -cp /tmp/tla2tools.jar tlc2.TLC -config model/receipts/SteadQReceipts.cfg model/SteadQReceipts.tla -workers auto
      - name: TLC maintenance progress model checking
        run: java -cp /tmp/tla2tools.jar tlc2.TLC -config model/maintenance/SteadQMaintenance.cfg model/SteadQMaintenance.tla -workers auto

  # Nightly lane: release-mode extended tests and benchmarks
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, pinned 2026-08-08
        with:
          toolchain: 1.97.1
      - name: Extended test run (release)
        run: cargo test --all --release
      - name: Descriptor leak regression (B-02)
        run: cargo test -p steadq-core -- descriptor
      - name: FD leak stress (T5)
        run: cargo test -p steadq-core --release -- fd_leak_stress
      - name: Benchmarks (P2-35 tracking only, no regression gate)
        run: cargo bench -p steadq-core --bench queue_ops -- --warm-up-time 1 --measurement-time 3

  # Nightly lane: recovery soak sized to cross the 65,536-entry directory
  # limit and one pass's scan budget
  nightly-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, pinned 2026-08-08
        with:
          toolchain: 1.97.1
      - name: Recovery soak (release)
        run: cargo test --release -p steadq-testkit --test soak -- --ignored --nocapture

  # Full mutation tracking is advisory and runs in parallel with the bounded
  # release-test lane. Each shard gets its own wall-clock budget.
  nightly-mutants:
    name: nightly-mutants (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: foundations
            packages: -p steadq-format -p steadq-names -p steadq-math -p steadq-fs-linux
            jobs: 2
            mutant_timeout: 30
            shard_args: ""
          - name: steadq-core-0-of-4
            packages: -p steadq-core
            jobs: 4
            mutant_timeout: 60
            shard_args: --shard 0/4 --sharding round-robin
          - name: steadq-core-1-of-4
            packages: -p steadq-core
            jobs: 4
            mutant_timeout: 60
            shard_args: --shard 1/4 --sharding round-robin
          - name: steadq-core-2-of-4
            packages: -p steadq-core
            jobs: 4
            mutant_timeout: 60
            shard_args: --shard 2/4 --sharding round-robin
          - name: steadq-core-3-of-4
            packages: -p steadq-core
            jobs: 4
            mutant_timeout: 60
            shard_args: --shard 3/4 --sharding round-robin
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, pinned 2026-08-08
        with:
          toolchain: 1.97.1
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Full mutation suite (${{ matrix.name }})
        continue-on-error: true
        run: cargo mutants ${{ matrix.packages }} -j ${{ matrix.jobs }} --timeout ${{ matrix.mutant_timeout }} ${{ matrix.shard_args }} --cap-lints true
